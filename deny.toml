# cargo-deny configuration. Run via `just deny` (CI runs it in its own job).
#
# Schema is cargo-deny >= 0.16: `targets` lives under `[graph]`, and the old
# `advisories.vulnerability`/`advisories.notice`/`licenses.unlicensed`/
# `licenses.copyleft`/`licenses.default` keys are gone — a vulnerability or an
# unlicensed crate is always an error now, so they need no setting. Keep this
# file in the current schema: cargo-deny rejects an unknown or retired key
# outright rather than ignoring it, which fails the whole check.

[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
# "workspace" reports unmaintained advisories for this crate's own direct
# dependencies. Widen to "all" to include transitive ones once the dependency
# tree is stable enough that the noise is actionable.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# The allow-list is the policy: a dependency under anything not listed here
# fails the check. Add a license deliberately, never to silence a finding.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "ISC",
  "Zlib",
]
# Without this, every allowed-but-unused license is a `license-not-encountered`
# finding and the check fails — which would mean pruning the list down to
# exactly today's dependency tree and re-editing it on every `cargo add`.
unused-allowed-license = "allow"
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
