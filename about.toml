# cargo-about configuration. `just licenses` renders THIRD-PARTY-LICENSES.md
# from it, and the release workflow attaches that file to the GitHub release.
#
# `accepted` mirrors `licenses.allow` in deny.toml: a crate under anything else
# fails the run, so an unresolvable license stops a release before it publishes.
# Widen both lists together, deliberately.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "ISC",
  "Zlib",
]

# The binaries are what ships, so test-only crates stay out of the notices.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Same targets as deny.toml's [graph]: the crates built into the release binaries.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
