# Setup scripts (see the end of this file) are still an experimental nextest
# feature.
experimental = ["setup-scripts"]

# nextest's default profile, so every runner shares one output level rather
# than each recipe remembering a flag.
#
# `just test` passes `--status-level fail` on the command line. `just cover`
# runs the same suite through `cargo llvm-cov nextest`, which accepts that flag
# and IGNORES it — measured on a real project at 2316 lines, 2137 of them `PASS`,
# one per test, to report a green suite and a coverage table. A flag that is
# accepted and ignored is worse than one that is absent, because the recipe then
# claims something the output disproves.
#
# Setting it here fixes it where both runners read it. A green run prints the
# summary and nothing per test; a failure still prints, per test, which is the
# whole point of `fail` rather than `none`.
[profile.default]
status-level = "fail"

# The tests that evaluate src/*.nix with the real `nix` write derivations; a
# setup script points them at a scratch store (see src/nix_tests.rs) so the
# real one stays untouched. The script exports NIX_REMOTE to them alone.
[scripts.setup.nix-scratch-store]
command = "tests/support/nix-scratch-store.sh"

[[profile.default.scripts]]
filter = "test(/::nix_tests::/)"
setup = "nix-scratch-store"
